[project]
name = "ray-reproducibility"
dynamic = ["version"]
description = "Ray Data reproducibility and data-pipeline checkpointing examples."
requires-python = ">=3.10"
dependencies = [
    # ray is expected to be installed from the `kit/repro-example` development
    # branch (see README). It is intentionally not pinned here so that an
    # editable install of ~/github/ray takes precedence.
    "pyarrow>=14",
    "numpy>=1.24",
    "xxhash>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ray_repro/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_repro"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ray_repro",
    "README.md",
    "pyproject.toml",
]

[tool.uv]
# Ray is installed externally from a local editable checkout; do not let uv
# manage it via this project's lockfile.
